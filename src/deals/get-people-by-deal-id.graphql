query GetPeopleAndOwnerByDealId($id: String!) {
  deal(id: $id) {
    name
    associated_people {
      id
      name {
        first_name
        last_name
      }
      email_addresses
      phone_numbers
      job_title
      primary_location {
        locality
        region
        country
        postcode
      }
      company {
        name
      }
    }
    owner {
      __typename
      ... on User {
        name
        email
      }
    }
  }
}
